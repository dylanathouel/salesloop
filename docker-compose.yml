services:
  db:
    # pgvector official image (Debian, multi-arch) — needed for the RAG layer
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-salesloop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-salesloop_dev_2026}
      POSTGRES_DB: ${DB_NAME:-salesloop}
    ports:
      # 5433 on the host: avoids clashing with a locally installed Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesloop"]
      interval: 5s
      timeout: 3s
      retries: 5
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-salesloop}:${DB_PASSWORD:-salesloop_dev_2026}@db:5432/${DB_NAME:-salesloop}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
    # Apply migrations then start the dev server with hot reload
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
