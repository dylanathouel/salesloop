services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-salesloop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-salesloop_dev_2026}
      POSTGRES_DB: ${DB_NAME:-salesloop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesloop"]
      interval: 5s
      timeout: 3s
      retries: 5
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-salesloop}:${DB_PASSWORD:-salesloop_dev_2026}@db:5432/${DB_NAME:-salesloop}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: